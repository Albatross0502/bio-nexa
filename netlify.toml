# Catch unknown /api/* routes with structured JSON 404 instead of SPA HTML
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-not-found/:splat"
  status = 200

# Single-Page Application (SPA) catch-all rewrite:
# Prevents 404 errors on deep routes (/opportunities, /jobs, /admin, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
