# Netlify Production Configuration for BIO-INEXA
# https://bio-inexa-0.netlify.app/

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."sync-opportunities"]
  schedule = "0 */6 * * *"

# -----------------------------------------------------------------
# API Routing to Modular Netlify Serverless Functions
# Evaluated strictly BEFORE the SPA /* -> /index.html catch-all.
# -----------------------------------------------------------------

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/jobs"
  status = 200

[[redirects]]
  from = "/api/jobs/*"
  to = "/.netlify/functions/jobs/:splat"
  status = 200

